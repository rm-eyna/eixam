<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eixam</title>
<style>
  html, body { margin: 0; height: 100%; background: #040b1a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

// ---------- Constants ----------
const W = 800, H = 600;
const PLAYER_Y = 548, PLAYER_W = 34, PLAYER_H = 40, PLAYER_SPEED = 330;
const COLS = 9, ROWS = 5, GAP_X = 60, GAP_Y = 46, EN_W = 36, EN_H = 30;
const STEP_DOWN = 18;
const CS = 5, SH_COLS = 20, SH_ROWS = 12, SH_Y = 450, SH_COUNT = 4;
const ROW_POINTS = [40, 30, 30, 20, 20];      // top rows are worth more
const ROW_TYPE = ['spore', 'rhomb', 'rhomb', 'jelly', 'jelly'];
const COLORS = { coral: '#ff6b5e', magenta: '#e0409a', amber: '#ffb347' };
const TYPE_COLOR = { spore: COLORS.amber, rhomb: COLORS.magenta, jelly: COLORS.coral };
const SHIELD_COLORS = [null, '#d9735b', '#e8c27a', '#8fd3e8'];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ---------- Scaling (fixed logic size, crisp on any DPR) ----------
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  canvas.width = Math.max(1, Math.round(W * s * dpr));
  canvas.height = Math.max(1, Math.round(H * s * dpr));
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener('resize', fit);
fit();

// ---------- Record (localStorage may fail) ----------
function loadRecord() {
  try { return parseInt(localStorage.getItem('eixam.record'), 10) || 0; } catch (e) { return 0; }
}
function saveRecord(v) {
  try { localStorage.setItem('eixam.record', String(v)); } catch (e) { /* ignore */ }
}

// ---------- State ----------
let state = 'title';        // title | banner | playing | over
let paused = false;
let record = loadRecord();
let newRecord = false;
let score, lives, wave, player, pBullets, eBullets, swarm, shields, particles;
let bannerT = 0, overAt = 0, time = 0, fireCd = 0, enemyFireT = 0;

const stars = Array.from({ length: 90 }, () => ({
  x: Math.random() * W, y: Math.random() * H,
  r: Math.random() * 1.3 + 0.3, ph: Math.random() * 6.28, sp: 0.5 + Math.random() * 1.5
}));

const keys = new Set();

function newGame() {
  keys.delete('Space');   // a held space must not fire automatically
  score = 0; lives = 3; wave = 1; newRecord = false;
  player = { x: W / 2, inv: 0 };
  shields = makeShields();
  startWave();
}

function startWave() {
  pBullets = []; eBullets = []; particles = particles || [];
  const alive = [];
  for (let r = 0; r < ROWS; r++) { alive.push(new Array(COLS).fill(true)); }
  swarm = {
    alive, count: ROWS * COLS, fx: (W - (COLS - 1) * GAP_X) / 2,
    fy: 70 + Math.min((wave - 1) * 16, 96), dir: 1
  };
  enemyFireT = 1;
  bannerT = 2;
  state = 'banner';
}

function makeShields() {
  const list = [];
  const sw = SH_COLS * CS;
  for (let i = 0; i < SH_COUNT; i++) {
    const cx = (W / SH_COUNT) * (i + 0.5);
    const cells = [];
    for (let r = 0; r < SH_ROWS; r++) {
      for (let c = 0; c < SH_COLS; c++) {
        let hp = 3;
        if (r === 0 && (c < 2 || c >= SH_COLS - 2)) hp = 0;        // rounded top corners
        if (r >= 8 && c >= 7 && c < 13) hp = 0;                    // arch at the bottom
        cells.push(hp);
      }
    }
    list.push({ x: cx - sw / 2, y: SH_Y, cells });
  }
  return list;
}

// ---------- Helpers ----------
function enemyPos(r, c) { return { x: swarm.fx + c * GAP_X, y: swarm.fy + r * GAP_Y }; }
function overlap(a, b) { return a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1; }

function explode(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = 40 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 0.4 + Math.random() * 0.4, color });
  }
}

// Damage the first shield cell touched by rect. `fromBelow`: scan from the bottom (player shots).
function hitShield(rect, fromBelow) {
  for (const sh of shields) {
    const bx = { x1: sh.x, y1: sh.y, x2: sh.x + SH_COLS * CS, y2: sh.y + SH_ROWS * CS };
    if (!overlap(rect, bx)) continue;
    const c0 = Math.max(0, Math.floor((rect.x1 - sh.x) / CS));
    const c1 = Math.min(SH_COLS - 1, Math.floor((rect.x2 - sh.x) / CS));
    const r0 = Math.max(0, Math.floor((rect.y1 - sh.y) / CS));
    const r1 = Math.min(SH_ROWS - 1, Math.floor((rect.y2 - sh.y) / CS));
    for (let k = 0; k <= r1 - r0; k++) {
      const r = fromBelow ? r1 - k : r0 + k;
      for (let c = c0; c <= c1; c++) {
        const i = r * SH_COLS + c;
        if (sh.cells[i] > 0) {
          sh.cells[i]--;
          explode(sh.x + c * CS + CS / 2, sh.y + r * CS + CS / 2, SHIELD_COLORS[3], 3);
          return true;
        }
      }
    }
  }
  return false;
}

// Remove every shield cell overlapped by rect (swarm crushing the shields).
function crushShields(rect) {
  for (const sh of shields) {
    const c0 = Math.max(0, Math.floor((rect.x1 - sh.x) / CS));
    const c1 = Math.min(SH_COLS - 1, Math.floor((rect.x2 - sh.x) / CS));
    const r0 = Math.max(0, Math.floor((rect.y1 - sh.y) / CS));
    const r1 = Math.min(SH_ROWS - 1, Math.floor((rect.y2 - sh.y) / CS));
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) sh.cells[r * SH_COLS + c] = 0;
  }
}

function lowestEnemyRow() {
  for (let r = ROWS - 1; r >= 0; r--) if (swarm.alive[r].some(Boolean)) return r;
  return -1;
}

function gameOver() {
  state = 'over';
  overAt = performance.now();
  if (score > record) { record = score; newRecord = true; saveRecord(record); }
}

// ---------- Update ----------
function update(dt) {
  if (paused) return;
  time += dt;
  for (const s of stars) s.ph += s.sp * dt;
  for (let i = particles ? particles.length - 1 : -1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97;
    if (p.life >= p.max) particles.splice(i, 1);
  }
  if (paused || (state !== 'playing' && state !== 'banner')) return;

  // Player movement and shooting
  let mv = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) mv -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) mv += 1;
  player.x = Math.max(PLAYER_W / 2 + 6, Math.min(W - PLAYER_W / 2 - 6, player.x + mv * PLAYER_SPEED * dt));
  if (player.inv > 0) player.inv = Math.max(0, player.inv - dt);
  fireCd -= dt;

  if (state === 'banner') {
    bannerT -= dt;
    if (bannerT <= 0) state = 'playing';
    return;
  }

  if (keys.has('Space') && fireCd <= 0 && pBullets.length < 2) {
    pBullets.push({ x: player.x, y: PLAYER_Y - PLAYER_H / 2 });
    fireCd = 0.22;
  }

  // Swarm movement: speeds up as enemies die and with each wave
  const frac = 1 - swarm.count / (ROWS * COLS);
  const speed = (30 + wave * 7) * (1 + 3.2 * frac * frac) + 40 * frac;
  swarm.fx += swarm.dir * speed * dt;
  let minC = COLS, maxC = -1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (swarm.alive[r][c]) { minC = Math.min(minC, c); maxC = Math.max(maxC, c); }
  }
  const left = swarm.fx + minC * GAP_X - EN_W / 2, right = swarm.fx + maxC * GAP_X + EN_W / 2;
  if (swarm.dir > 0 && right >= W - 10) {
    swarm.fx -= right - (W - 10); swarm.dir = -1; swarm.fy += STEP_DOWN;
  } else if (swarm.dir < 0 && left <= 10) {
    swarm.fx += 10 - left; swarm.dir = 1; swarm.fy += STEP_DOWN;
  }

  // Swarm crushes shields it touches; reaching the player's height ends the game
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!swarm.alive[r][c]) continue;
    const e = enemyPos(r, c);
    crushShields({ x1: e.x - EN_W / 2, y1: e.y - EN_H / 2, x2: e.x + EN_W / 2, y2: e.y + EN_H / 2 });
  }
  const lr = lowestEnemyRow();
  if (lr >= 0 && swarm.fy + lr * GAP_Y + EN_H / 2 >= PLAYER_Y - PLAYER_H / 2) {
    lives = 0; explode(player.x, PLAYER_Y, COLORS.amber, 40); gameOver(); return;
  }

  // Enemy fire: a random column shoots from its lowest enemy
  enemyFireT -= dt;
  const maxShots = 3 + wave;
  if (enemyFireT <= 0 && eBullets.length < maxShots) {
    enemyFireT = Math.max(0.25, (1.1 - wave * 0.09) * (0.5 + Math.random() * 0.9));
    const cols = [];
    for (let c = 0; c < COLS; c++) for (let r = ROWS - 1; r >= 0; r--) {
      if (swarm.alive[r][c]) { cols.push([r, c]); break; }
    }
    if (cols.length) {
      const [r, c] = cols[Math.floor(Math.random() * cols.length)];
      const e = enemyPos(r, c);
      eBullets.push({ x: e.x, y: e.y + EN_H / 2, vy: 200 + wave * 18 });
    }
  }

  // Player bullets (swept rect so fast shots never tunnel)
  for (let i = pBullets.length - 1; i >= 0; i--) {
    const b = pBullets[i];
    const prevY = b.y; b.y -= 620 * dt;
    const rect = { x1: b.x - 2, y1: b.y - 8, x2: b.x + 2, y2: prevY + 4 };
    if (b.y < -10) { pBullets.splice(i, 1); continue; }
    let hit = false;
    for (let r = 0; r < ROWS && !hit; r++) for (let c = 0; c < COLS && !hit; c++) {
      if (!swarm.alive[r][c]) continue;
      const e = enemyPos(r, c);
      if (overlap(rect, { x1: e.x - EN_W / 2, y1: e.y - EN_H / 2, x2: e.x + EN_W / 2, y2: e.y + EN_H / 2 })) {
        swarm.alive[r][c] = false; swarm.count--;
        score += ROW_POINTS[r];
        explode(e.x, e.y, TYPE_COLOR[ROW_TYPE[r]], 18);
        hit = true;
      }
    }
    if (!hit) hit = hitShield(rect, true);
    if (hit) pBullets.splice(i, 1);
  }

  // Wave cleared
  if (swarm.count === 0) {
    score += 100 * wave;
    wave++;
    startWave();
    return;
  }

  // Enemy bullets
  const pr = { x1: player.x - PLAYER_W / 2, y1: PLAYER_Y - PLAYER_H / 2, x2: player.x + PLAYER_W / 2, y2: PLAYER_Y + PLAYER_H / 2 };
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    const prevY = b.y; b.y += b.vy * dt;
    const rect = { x1: b.x - 3, y1: prevY - 6, x2: b.x + 3, y2: b.y + 6 };
    if (b.y > H + 10) { eBullets.splice(i, 1); continue; }
    if (hitShield(rect, false)) { eBullets.splice(i, 1); continue; }
    if (player.inv <= 0 && overlap(rect, pr)) {
      eBullets.splice(i, 1);
      lives--;
      explode(player.x, PLAYER_Y, COLORS.amber, 30);
      if (lives <= 0) { gameOver(); return; }
      player.inv = 2; eBullets.length = 0;
      break;
    }
  }
}

// ---------- Drawing ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a1f45'); g.addColorStop(0.6, '#07142e'); g.addColorStop(1, '#040b1a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(s.ph));
    ctx.fillStyle = '#cfe4ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawJelly(x, y, color, t) {
  ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y - 3, 15, Math.PI, 0); ctx.lineTo(x + 15, y + 2); ctx.lineTo(x - 15, y + 2); ctx.closePath(); ctx.fill();
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(x + i * 6, y + 2);
    for (let k = 1; k <= 4; k++) ctx.lineTo(x + i * 6 + Math.sin(t * 5 + i + k) * 3, y + 2 + k * 3.2);
    ctx.stroke();
  }
  ctx.fillStyle = '#1a0b2e';
  ctx.beginPath(); ctx.arc(x - 5, y - 4, 2.2, 0, 6.283); ctx.arc(x + 5, y - 4, 2.2, 0, 6.283); ctx.fill();
}

function drawRhomb(x, y, color) {
  const w = 18, h = 15;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x + w, y); ctx.lineTo(x, y + h); ctx.lineTo(x - w, y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';       // facets
  ctx.beginPath(); ctx.moveTo(x, y - h); ctx.lineTo(x + w, y); ctx.lineTo(x, y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x - w, y); ctx.lineTo(x, y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff4d6';
  ctx.beginPath(); ctx.arc(x, y, 3, 0, 6.283); ctx.fill();
}

function drawSpore(x, y, color, t) {
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (let i = 0; i < 10; i++) {
    const a = i * 0.6283 + t * 0.8;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 10, y + Math.sin(a) * 10);
    ctx.lineTo(x + Math.cos(a) * 17, y + Math.sin(a) * 17); ctx.stroke();
  }
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 11, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(x - 3, y - 3, 4, 0, 6.283); ctx.fill();
}

function drawPlayer() {
  if (player.inv > 0 && Math.floor(player.inv * 10) % 2 === 0) return;   // blink
  const x = player.x, y = PLAYER_Y;
  // warm glow
  const g = ctx.createRadialGradient(x, y - 14, 2, x, y - 14, 38);
  g.addColorStop(0, 'rgba(255,214,120,0.75)'); g.addColorStop(1, 'rgba(255,214,120,0)');
  ctx.fillStyle = g; ctx.fillRect(x - 40, y - 54, 80, 80);
  // base and narrow tower
  ctx.fillStyle = '#c9d6ea';
  ctx.beginPath(); ctx.moveTo(x - 17, y + 20); ctx.lineTo(x + 17, y + 20); ctx.lineTo(x + 10, y + 10); ctx.lineTo(x - 10, y + 10); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 8, y + 10); ctx.lineTo(x + 8, y + 10); ctx.lineTo(x + 5, y - 8); ctx.lineTo(x - 5, y - 8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e0409a'; ctx.fillRect(x - 6.5, y - 1, 13, 5);   // stripe
  // lamp room and roof
  ctx.fillStyle = '#ffe2a0'; ctx.fillRect(x - 6, y - 17, 12, 9);
  ctx.fillStyle = '#ff6b5e';
  ctx.beginPath(); ctx.moveTo(x - 8, y - 17); ctx.lineTo(x + 8, y - 17); ctx.lineTo(x, y - 24); ctx.closePath(); ctx.fill();
}

function drawShields() {
  for (const sh of shields) {
    for (let r = 0; r < SH_ROWS; r++) for (let c = 0; c < SH_COLS; c++) {
      const hp = sh.cells[r * SH_COLS + c];
      if (hp <= 0) continue;
      ctx.fillStyle = SHIELD_COLORS[hp];
      ctx.fillRect(sh.x + c * CS, sh.y + r * CS, CS - 0.5, CS - 0.5);
    }
  }
}

function drawText(txt, x, y, size, color, align) {
  ctx.font = 'bold ' + size + 'px system-ui, "Segoe UI", sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color || '#f2f6ff';
  ctx.fillText(txt, x, y);
}

function drawWorld() {
  drawShields();
  if (swarm) {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (!swarm.alive[r][c]) continue;
      const e = enemyPos(r, c), t = ROW_TYPE[r], col = TYPE_COLOR[t];
      if (t === 'jelly') drawJelly(e.x, e.y, col, time + c * 0.4);
      else if (t === 'rhomb') drawRhomb(e.x, e.y, col);
      else drawSpore(e.x, e.y, col, time + c);
    }
  }
  if (player) drawPlayer();
  ctx.fillStyle = '#ffe2a0';
  for (const b of pBullets || []) { ctx.fillRect(b.x - 2, b.y - 8, 4, 14); }
  ctx.fillStyle = '#ff9bd0';
  for (const b of eBullets || []) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, 6.283); ctx.fill();
  }
  for (const p of particles || []) {
    ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawHud() {
  drawText('Puntuació ' + score, 16, 20, 18, '#f2f6ff', 'left');
  drawText('Oleada ' + wave, W / 2, 20, 18, '#9fb7dd');
  drawText('Rècord ' + Math.max(record, score), W - 16, 20, 18, '#ffe2a0', 'right');
  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = '#ffd37a';
    ctx.beginPath(); ctx.moveTo(24 + i * 22, H - 28); ctx.lineTo(30 + i * 22, H - 10); ctx.lineTo(18 + i * 22, H - 10); ctx.closePath(); ctx.fill();
  }
}

function dim(a) { ctx.fillStyle = 'rgba(4,11,26,' + a + ')'; ctx.fillRect(0, 0, W, H); }

function draw() {
  drawBackground();
  if (state === 'title') {
    drawText('EIXAM', W / 2, 150, 84, '#ffb347');
    drawText('Defensa el far de l’eixam lluminós', W / 2, 215, 22, '#9fb7dd');
    drawText('← → o A / D: moure’t', W / 2, 300, 22);
    drawText('Espai: disparar   ·   P: pausa', W / 2, 335, 22);
    drawText('Rècord: ' + record, W / 2, 400, 26, '#ffe2a0');
    if (Math.floor(performance.now() / 600) % 2 === 0) drawText('Prem espai per començar', W / 2, 480, 28, '#ff6b5e');
    return;
  }
  drawWorld();
  drawHud();
  if (state === 'banner') drawText('Oleada ' + wave, W / 2, 300, 64, '#ffb347');
  if (state === 'over') {
    dim(0.65);
    drawText('Fi de la partida', W / 2, 190, 60, '#ff6b5e');
    drawText('Puntuació: ' + score, W / 2, 270, 30);
    drawText('Rècord: ' + record, W / 2, 315, 26, '#ffe2a0');
    if (newRecord) drawText('Nou rècord!', W / 2, 365, 34, '#ffb347');
    if (performance.now() - overAt > 800) drawText('Prem espai per tornar a jugar', W / 2, 450, 26, '#f2f6ff');
  }
  if (paused) { dim(0.55); drawText('Pausa', W / 2, 300, 72, '#ffb347'); }
}

// ---------- Input ----------
const BLOCK = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space']);
window.addEventListener('keydown', e => {
  if (BLOCK.has(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  if (e.code === 'Space') {
    if (state === 'title') newGame();
    else if (state === 'over' && performance.now() - overAt > 800) newGame();
  } else if (e.code === 'KeyP' && (state === 'playing' || state === 'banner')) {
    paused = !paused;
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => {
  keys.clear();
  if (state === 'playing' || state === 'banner') paused = true;
});

// ---------- Main loop ----------
particles = [];
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
